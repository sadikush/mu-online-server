services:
  nginx-80:
    image: nginx:alpine
    container_name: nginx-80
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.dev.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - openmu-startup

  openmu-startup:
    image: munique/openmu
    container_name: openmu-startup
    ports:
      - "8080"
      - "55901:55901"
      - "44405:44405"
      - "44406:44406"
      - "55980:55980"
    environment:
      DB_HOST: ${DB_HOST:-database}
      DB_ADMIN_USER: ${DB_ADMIN_USER:-}
      DB_ADMIN_PW: ${DB_ADMIN_PW:-}
      ASPNETCORE_URLS: http://+:8080
      # Optional bootstrap admin panel user. Without it, the admin panel is reachable
      # without a login until the first user has been created within the panel itself.
      OPENMU_ADMIN_USER: ${OPENMU_ADMIN_USER:-}
      OPENMU_ADMIN_PASSWORD: ${OPENMU_ADMIN_PASSWORD:-}
      # Optional base32 TOTP secret, if the bootstrap user should require a second factor.
      OPENMU_ADMIN_TOTP_SECRET: ${OPENMU_ADMIN_TOTP_SECRET:-}
      # website authenticates itself at the public API under /api.
      # How the server determines the IP address it reports to game clients.
      # Empty = default (public, via ipify.org). See README's troubleshooting section.
      RESOLVE_IP: ${RESOLVE_IP:-}
    volumes:
      - adminpanel-keys:/app/data-protection-keys
    working_dir: /app/
    depends_on:
      - database

  playit:
    image: ghcr.io/playit-cloud/playit-agent:1.0
    container_name: playit
    restart: unless-stopped
    environment:
      SECRET_KEY: ${PLAYIT_SECRET_KEY:-}
    depends_on:
      - openmu-startup
    # No `ports:` and no `network_mode: host` here on purpose: this agent only
    # needs to reach other containers in this same compose project (by their
    # service name, e.g. "openmu-startup") and to make outbound connections to
    # playit.gg. Host networking is Linux-only and unreliable on Docker
    # Desktop for Windows/Mac, so we deliberately don't use it.

  database:
    image: postgres
    container_name: database
    environment:
      POSTGRES_PASSWORD: ${DB_ADMIN_PW:-admin}
      POSTGRES_DB: ${DB_NAME:-openmu}
      POSTGRES_USER: ${DB_ADMIN_USER:-postgres}
    ports:
      - "5432"
    volumes:
      - dbdata:/var/lib/postgresql #store data on volume

volumes:
  adminpanel-keys:
  dbdata: